# Eligibility policy v1 — see docs/eligibility-policy.md. Money in cents. Bands: first match wins.
version: v1
minScore: 60
statement:
  currency: MXN
  maxAgeDays: 90
  score:
    avgMonthlyCredits: # S-S1
      - { min: 20000000, points: 30 } # ≥ 200,000 MXN
      - { min: 5000000, points: 20 } # ≥ 50,000
      - { min: 2000000, points: 10 } # ≥ 20,000
    liquidityBuffer: # S-S2: avg daily balance / avg monthly debits
      - { min: 0.20, points: 20 }
      - { min: 0.05, points: 10 }
    bouncedEntries: # S-S3
      - { max: 0, points: 20 }
      - { max: 2, points: 10 }
    topPayerShare: # S-S4
      - { max: 0.60, points: 15 }
      - { max: 0.85, points: 8 }
    creditDebitRatio: # S-S5
      - { min: 0.9, max: 1.3, points: 15 }
      - { min: 0.7, max: 1.5, points: 8 }
invoice:
  voucherTypes: [I] # C-K1
  paymentMethods: [PPD] # C-K2
  anchorBuyers: # C-K3: buyers of the distribution chain (sample RFCs for local runs)
    - DCM850101AB1
    - ACH900215KL3
  dueInDays: { min: 7, max: 120 } # C-K4
  total: { min: 500000, max: 500000000 } # C-K5: 5,000 – 5,000,000 MXN
advance:
  invoiceShare: 0.9
  monthlyCreditsShare: 0.5
