# Artillery baseline (health only). The main scenario is api.yml.
# Run: make test-load LOAD_SCRIPT=health.yml (stack must be up). Fails the run if thresholds are not met.
config:
  # Override with: artillery run --target <url> health.yml (make test-load LOAD_TARGET=...)
  target: http://api:3000
  phases:
    - name: warm-up
      duration: 10
      arrivalRate: 5
    - name: ramp
      duration: 20
      arrivalRate: 5
      rampTo: 50
    - name: sustained
      duration: 30
      arrivalRate: 50
  plugins:
    ensure: {}
  ensure:
    thresholds:
      - http.response_time.p95: 200
      - http.response_time.p99: 500
    conditions:
      - expression: 'vusers.failed == 0'
scenarios:
  - name: health
    flow:
      - get:
          url: /health
          expect:
            - statusCode: 200
