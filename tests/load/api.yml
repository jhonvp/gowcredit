# Artillery load test for the API: health, case reads (Postgres) and uploads (S3 + SQS on Floci).
# Run: make test-load (stack must be up). Fails the run if thresholds are not met.
# sample-statement.pdf is synthetic (generated by test/integration/support/tiny-pdf.ts).
config:
  target: http://api:3000
  phases:
    - name: warm-up
      duration: 10
      arrivalRate: 5
    - name: ramp
      duration: 20
      arrivalRate: 5
      rampTo: 40
    - name: sustained
      duration: 30
      arrivalRate: 40
  plugins:
    ensure: {}
  ensure:
    thresholds:
      - http.response_time.p95: 200
      - http.response_time.p99: 500
    conditions:
      - expression: 'vusers.failed == 0'
scenarios:
  - name: health
    weight: 3
    flow:
      - get:
          url: /health
          expect:
            - statusCode: 200
  # Upload then poll the case a few times, like the supplier screen does.
  - name: upload and read case
    weight: 1
    flow:
      - post:
          url: /api/documents
          formData:
            file:
              fromFile: ./sample-statement.pdf
              contentType: application/pdf
          capture:
            - json: $.caseId
              as: caseId
          expect:
            - statusCode: 202
      - loop:
          - get:
              url: /api/cases/{{ caseId }}
              expect:
                - statusCode: 200
          - think: 1
        count: 5
